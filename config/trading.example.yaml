# config/trading.yaml — trading knobs that Claude can read/write freely.
# Copy this file to config/trading.yaml and customize, or let `trading tune` write it for you.
# Secrets (tokens, encryption key, SMTP creds) live in .env, NEVER here.

# === Execution Mode ===
# paper | dry-run | live | autonomous
execution_mode: paper

# === Strategy and universe ===
default_strategy: bollinger
default_symbols: "XIC.TO,VOO,IWM"
timezone: America/Toronto
# Currency used for equity, sizing, and heat math. Pick the side of your
# Questrade multi-currency account that actually holds cash. CAD for Canadian
# accounts (XIC.TO etc.); USD for US-funded accounts (VOO, AAPL etc.).
account_currency: CAD

# === Risk gates (apply to every order, all modes) ===
risk_pct_per_trade: 0.01            # 1% account risk per trade
portfolio_heat_cap: 0.05            # 5% aggregate open-risk cap
risk_model: cvar                    # how the heat gate estimates per-trade risk:
                                    #   cvar = Expected Shortfall, fat left tail (default)
                                    #   var  = 95% Value-at-Risk of the name's returns
                                    #   atr  = ATR-stop loss
heat_aggregation: corr              # how open positions combine for the heat gate:
                                    #   corr = covariance-aware, credits diversification (default)
                                    #   sum  = naive total, correlation-blind
daily_loss_limit_pct: 0.03          # -3% halts new entries today
max_drawdown_kill_switch: 0.08      # -8% trips kill-switch automatically
max_open_positions: 3
min_ticket_usd: 100.0

# === Monitor policy (every runner reads these) ===
# What you practise on paper is what runs with money: every runner reads these. A flag overrides one for a run.
# `trading doctor` shows what each layer has, and `trading audit query session-plans` compares sessions.
poll_interval_seconds: 300
strategy_map: ""                  # SYM=strategy,SYM=strategy
intel_overlay: true               # on whenever WORLDMONITOR_API_KEY is set
intel_refresh_seconds: 900
require_card: false
card_shim_port: 8787
card_ttl_seconds: 90
require_basket: false
spectral_var_cap: null            # e.g. 0.005 turns the gate on
spectral_var_level: 0.99
spectral_var_horizon: 1
hedge_symbol: ""                  # UUP runs the dollar-hedge overlay
# Set this to the money you plan to trade: rounding, the minimum ticket and fees all scale with it.
paper_starting_equity: 100000
# Paper's costs per venue, over monitor/session.py DEFAULT_PAPER_COSTS, which are assumptions. Replace them
# with what `trading audit query fill-quality` measures, e.g.:
# paper_costs: {kraken: {commission_bps: 40, slippage_bps: 5, commission_per_trade: 0}}
paper_costs: {}
ib_auto_confirm_prompts: false    # off: an IB warning prompt rejects the order
# Skip a symbol while its venue is outside regular hours. No holiday calendar: a holiday reads as open.
respect_market_hours: true
# Act on Router.check_forced_exits. Off by default: it sends SELL orders with no strategy signal behind
# them. force_exit_atr_mult sets how far a position may fall first.
forced_exits: false
# Per-symbol entry channels for strategies that emit entry_level: event | level | both.
# A symbol not named takes its strategy family's default (only bollinger acts on level by default).
entry_triggers: {}

# === Questrade target ===
# practice | live. 'practice' = Questrade's free practice account; 'live' = real money.
questrade_env: practice
# Empty string = use first account returned by the API.
questrade_account_number: ""

# === Autonomous mode (Claude-driven daemon) ===
autonomous_enabled: false
autonomous_account: practice
autonomous_auto_start_on_session: false
autonomous_interval_seconds: 600     # 10 minutes
autonomous_strategy: bollinger
autonomous_symbols: "XIC.TO,VOO,IWM"
autonomous_daily_max_trades: 5
autonomous_daily_max_notional_usd: 2000.0

# === Storage ===
log_level: INFO
state_dir: state
log_dir: logs
data_cache_dir: data/cache

# === Last auto-tune result (written by `trading tune`) ===
last_tune:
  ran_at: ""
  scoreboard: []
